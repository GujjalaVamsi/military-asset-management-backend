# ---- DEMO DB CREDENTIALS: replace with your real MySQL values ----
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/military_assets?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.port=${PORT:${SERVER_PORT:8081}}
server.error.include-message=always
app.jwt.secret=${APP_JWT_SECRET:local-development-secret-change-before-deploy-0123456789abcdef}
app.jwt.expiration-ms=28800000
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
